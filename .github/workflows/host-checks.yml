name: Host checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  device-free-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install host dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: MusicXML tests
        run: python -m unittest discover -s tools/media-import/tests -v
      - name: Music library tests
        run: python -m unittest discover -s tools/music-library/tests -v
      - name: MUSB tests
        run: python -m unittest discover -s tools/usb-import/tests -v
      - name: Pitch EQ production-path host test
        run: python firmware/arduino/tests/host_pitch_eq/run_tests.py
      - name: Local Markdown links
        run: python tools/ci/check_markdown_links.py
